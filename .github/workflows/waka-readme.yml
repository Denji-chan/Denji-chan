name: Waka Readme

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  schedule:
    - cron: "30 0 * * *"    # every day at 00:30 UTC (05:30 Tashkent)

permissions:
  contents: write

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          ### content
          SHOW_TITLE: true          # title line with the time range
          SECTION_NAME: waka
          TIME_RANGE: last_7_days     # total time since you joined WakaTime
          SHOW_TOTAL: true          # "Total Time" line at the top
          SHOW_TIME: true           # hours and minutes next to each language
          LANG_COUNT: 8
          BLOCKS: ░█                # black-and-white bar
          CODE_LANG: txt            # plain text, no colours
          ### commit
          COMMIT_MESSAGE: Update coding time stats
